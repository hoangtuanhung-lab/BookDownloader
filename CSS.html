*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 520px at 8% -8%,rgba(99,102,241,.22),transparent 60%),radial-gradient(800px 520px at 100% 0,rgba(168,85,247,.16),transparent 55%),var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;background-attachment:fixed}
h2{font-size:15px;margin:0 0 8px}
.hdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
button.hlp{width:26px;height:26px;padding:0;border-radius:50%;font-weight:700;line-height:1}
#hlpB ol,#hlpB ul{margin:0;padding-left:20px}#hlpB li{margin:0 0 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#acPart,#acVol,#acText{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box;margin-top:4px}
#acText{resize:vertical}
#acPartNew,#acVolNew,#acFile{width:100%;box-sizing:border-box;margin-top:6px}
input:disabled{border-color:transparent;padding-left:0;font-weight:500}
#url{flex:1;min-width:200px}
.srchBox{position:relative;flex:1;min-width:220px}
.srchBox input{width:100%;padding-left:32px}
.srchBox .srchIco{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button.p{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff;box-shadow:0 0 20px var(--glow)}
button.x{border-color:var(--bad);color:var(--bad)}
