<style>
.rd{position:relative;
  --bg:#f2f5f7;--fg:#1b252d;--bar:#e2e8ec;--ln:#c6d1d8;--card:var(--bar);--ink:var(--fg);--line:var(--ln);--mut:#5d6b78;
  --acc:#0b63c4;--ttl:#0a3d68;--chn:#7a4a20;
  background:var(--bg);color:var(--fg);color-scheme:light}
.rd[data-theme=night]{color-scheme:dark;--bg:#0e1318;--fg:#bfc9d1;--bar:#172029;--ln:#27333d;--mut:#8497a5;--acc:#5fb0ff;--ttl:#8fc4ef;--chn:#e0ae7a}
.rd select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0}
.rd-top{position:relative;background:var(--bar);border-bottom:1px solid var(--line);padding:10px 92px 10px 12px;display:flex;align-items:center;gap:10px}
.rd-top .rdLogo{width:40px}
.rd-tt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rd-tt b{display:block;font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;color:var(--ttl);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-tt i{display:block;font-style:italic;font-weight:400;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-chap{display:block;font-weight:700;font-style:normal;color:var(--chn);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-top-btns{position:absolute;right:6px;top:8px;display:flex;gap:4px}
.rd-top-btns button{padding:6px 9px;font-size:15px;line-height:1}
.rd-top-btns button[aria-expanded=true]{border-color:var(--acc);color:var(--acc)}
.rd-find{display:none;position:relative;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.rd-find.on{display:block}
.rd-find input{width:100%;background:var(--bg);color:var(--ink)}
.rd-res{position:absolute;top:100%;left:12px;right:12px;max-height:50vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;z-index:8;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rd-res.on{display:block}
.rd-res div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.rd-res div:last-child{border-bottom:0}.rd-res div:hover{background:var(--bg)}
.rd-res small{display:block;color:var(--mut)}
.rd-pop{display:none;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.rd-pop.on{display:flex}
.rd-pop #rdFontBtn{font-family:Georgia,'Times New Roman',serif;font-weight:700;min-width:36px}
.rd-pop #rdFontBtn[aria-expanded=true]{border-color:var(--acc);color:var(--acc)}
.rd-fonts{display:none;flex:1 1 100%;flex-wrap:wrap;gap:6px}
.rd-fonts.on{display:flex}
.rd-fonts button[data-f=tnr]{font-family:'Times New Roman',Tinos,Times,serif}
.rd-fonts button[data-f=mer]{font-family:Merriweather,Georgia,serif}
.rd-fonts button[data-f=rob]{font-family:Roboto,system-ui,sans-serif}
.rd-fonts button[data-f=gar]{font-family:Garamond,'EB Garamond',Georgia,serif;font-size:1.1em}
.rd-fonts button[aria-checked=true]{border-color:var(--acc);color:var(--acc);font-weight:700}
#rdText{max-width:40em;margin:0 auto;padding:18px 16px 100px;font:19px/1.85 'Literata',Georgia,serif}
#rdText p{margin:0 0 .9em}
#rdText .rd-msg{color:var(--mut);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
#rdBlue{position:fixed;inset:0;pointer-events:none;background:#ffa53a;mix-blend-mode:multiply;opacity:0;z-index:5}
.rd-float{--ink:#f8fafc;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);position:fixed;left:50%;right:auto;bottom:24px;width:min(640px,calc(100% - 24px));display:flex;gap:8px;align-items:center;padding:8px 12px;
  background:rgba(15,23,42,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;box-shadow:0 20px 40px rgba(0,0,0,.5);z-index:7;
  transform:translate(-50%,calc(100% + 40px));opacity:0;pointer-events:none;transition:transform .25s ease,opacity .25s ease}
.rd-float.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.rd-float select{flex:1;min-width:0;border-radius:99px}
.rd-float button{flex:none;background:transparent;border-color:transparent;border-radius:99px}
@media (min-width:721px){.rd-float{left:calc(50% + 105px)}}
@media (max-width:480px){.rd-top{padding-right:78px}.rd-top .rdLogo{width:32px}}
.rd.rd-paged .rd-main{max-width:44rem;margin:0 auto;padding:18px 16px;overflow:hidden;box-sizing:border-box;touch-action:pan-y}
.rd.rd-paged #rdText{max-width:none;margin:0;padding:0;column-fill:auto}
.rd-pg{display:none;align-items:center;gap:2px;flex:none}
.rd.rd-paged .rd-pg{display:inline-flex}
.rd-pginfo{min-width:3.6em;text-align:center;font-size:12px;color:var(--ink)}
.rd-float .rd-pg button{padding:6px 10px;font-size:18px;line-height:1}
.rd-tree{display:none;max-height:60vh;overflow:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.rd-tree.on{display:block}
.rd-tree .ct-tree{max-width:40em;margin:0 auto}
.rd-tree .rd-treebar{display:flex;gap:8px;margin:0 auto 6px;max-width:40em}
</style>
