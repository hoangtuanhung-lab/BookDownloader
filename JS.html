<script>
var S=null,INFO=null,busy=false,gone=false,cfgEdit=false,cur='dl';
var $=function(i){return document.getElementById(i)};
var ST={NEW:'Mới',ANALYZING:'Đang phân tích',ANALYZED:'Đã phân tích',READY:'Sẵn sàng',IDLE:'Đang chờ',DOWNLOADING:'Đang tải',PAUSED:'Tạm dừng',ERROR:'Có chương lỗi',COMPLETED:'Hoàn thành'};
var STC_={PENDING:'Đang chờ',DOWNLOADING:'Đang tải',DONE:'Đã tải',ERROR:'Lỗi'};
var thoatHtml=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var hostOf=function(u){var m=String(u==null?'':u).match(/^https?:\/\/([^\/?#]+)/i);return m?m[1].toLowerCase().replace(/^www\./,''):''};
var CA_VERB_={retry:'Đã tải lại chương ',cancel:'Đã hủy chương ',pause:'Đã tạm dừng chương ',delete:'Đã xóa chương '};

var ANA_STEPS_=['Kiểm tra trùng','Sinh mã truyện','Tạo/mở thư mục Drive','Thêm vào danh sách đã phân tích'];
function stepsRender_(box,steps,activeIdx){
  box.textContent='';
  steps.forEach(function(t,i){
    var cls=i<activeIdx?'done':(i===activeIdx?'active':''),d=document.createElement('div'),dot=document.createElement('span');
    d.className='anaStep'+(cls?' '+cls:'');dot.className='dot';d.appendChild(dot);d.appendChild(document.createTextNode(t));
    if(i<activeIdx){var tk=document.createElement('span');tk.className='tick';tk.textContent='✓';d.appendChild(document.createTextNode(' '));d.appendChild(tk)}
    box.appendChild(d);
  });
  box.style.display='flex';
}
function anaStepsRender_(activeIdx){stepsRender_($('anaSteps'),ANA_STEPS_,activeIdx)}
function anaStepsHide_(){var b=$('anaSteps');b.style.display='none';b.textContent=''}
function sleep_(ms){return new Promise(function(res){setTimeout(res,ms)})}
function anaStepsAnimate_(){
  anaStepsRender_(0);
  var i=0;
  return setInterval(function(){
    i++;
    if(i>=ANA_STEPS_.length-1){anaStepsRender_(ANA_STEPS_.length-1);return}
    anaStepsRender_(i);
  },450);
}
function call(fn){
  var a=[].slice.call(arguments,1);
  function attempt(n){
    return new Promise(function(res){
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.busy&&n<40){setTimeout(function(){res(attempt(n+1))},500);return}
        res(r);
      }).withFailureHandler(function(e){res({error:e.message})})[fn].apply(google.script.run,a);
    });
  }
  return attempt(0);
}
function say(t,bad){var m=$('msg');m.textContent=t||'';m.className=bad?'err':'muted'}
var TOAST_ICON_={success:'✓',error:'!',info:'i'},TOAST_MAX_=4;
function toastDrop_(n){
  if(!n.parentNode||n.classList.contains('out'))return;
  clearTimeout(n.tm);n.classList.add('out');
  setTimeout(function(){if(n.parentNode)n.parentNode.removeChild(n)},300);
}
function toastArm_(n){
  clearTimeout(n.tm);
  n.tm=setTimeout(function(){toastDrop_(n)},n.classList.contains('error')?7000:3500);
}
function showToast(message,type){
  var box=$('toastContainer'),kind=TOAST_ICON_[type]?type:'info',text=String(message==null?'':message),key=kind+'|'+text;
  var same=[].slice.call(box.children).filter(function(n){return n.dataset.key===key&&!n.classList.contains('out')})[0];
  if(same){toastArm_(same);return same}
  var n=document.createElement('div'),ic=document.createElement('span'),tx=document.createElement('span'),x=document.createElement('button');
  n.className='toast '+kind;n.dataset.key=key;n.setAttribute('role',kind==='error'?'alert':'status');
  ic.className='ti';ic.setAttribute('aria-hidden','true');ic.textContent=TOAST_ICON_[kind];
  tx.className='tm';tx.textContent=text;
  x.type='button';x.className='tx';x.setAttribute('aria-label','Đóng thông báo');x.textContent='×';
  x.onclick=function(){toastDrop_(n)};
  n.onmouseenter=function(){clearTimeout(n.tm)};
  n.onmouseleave=function(){toastArm_(n)};
  n.appendChild(ic);n.appendChild(tx);n.appendChild(x);box.appendChild(n);
  var live=[].slice.call(box.children).filter(function(k){return !k.classList.contains('out')});
  while(live.length>TOAST_MAX_)toastDrop_(live.shift());
  toastArm_(n);
  return n;
}
function toast(t,bad){
  var s=String(t==null?'':t).replace(/^✅\s*/,'');
  showToast(s,bad===true||bad==='error'?'error':(bad==='success'||(!bad&&/^Đã /.test(s)))?'success':'info');
}
var AM_={fn:null,done:null,prev:null,busy:false,down:null};
function amFinish_(ok){
  if(AM_.busy)return;
  $('mAsk').classList.remove('on');
  var d=AM_.done;AM_.fn=null;AM_.done=null;
  var p=AM_.prev;AM_.prev=null;
  if(p&&p.focus)p.focus();
  if(d)d(ok);
}
function closeModal(){amFinish_(false)}
function openModal(title,content,onConfirm,opt){
  opt=opt||{};
  if(AM_.done){var d0=AM_.done;AM_.done=null;d0(false)}
  $('amTitle').textContent=title||'';
  var body=$('amBody');body.textContent='';
  if(content&&content.nodeType)body.appendChild(content);
  else String(content==null?'':content).split('\n').forEach(function(t){var p=document.createElement('p');p.textContent=t;body.appendChild(p)});
  var ok=$('amOk'),no=$('amCancel');
  ok.textContent=opt.okText||'Xác nhận';
  ok.className=opt.danger?'x':'p';
  no.textContent=opt.cancelText||'Hủy';
  no.style.display=opt.hideCancel?'none':'';
  AM_.fn=onConfirm||null;AM_.done=opt.done||null;
  AM_.prev=document.activeElement;
  $('mAsk').classList.add('on');
  (opt.danger&&!opt.hideCancel?no:ok).focus();
}
function askConfirm(message,opt){
  return new Promise(function(res){
    openModal((opt&&opt.title)||'Xác nhận',message,null,Object.assign({},opt,{done:res}));
  });
}
$('amOk').onclick=async function(){
  var fn=AM_.fn;
  if(fn){
    var btn=this,keep=false;
    AM_.busy=true;btn.disabled=true;$('amCancel').disabled=true;
    try{keep=(await fn())===false}catch(e){toast('Không thực hiện được: '+(e&&e.message||e),true);keep=true}
    AM_.busy=false;btn.disabled=false;$('amCancel').disabled=false;
    if(keep)return;
  }
  amFinish_(true);
};
$('amCancel').onclick=closeModal;
$('amClose').onclick=closeModal;
$('mAsk').onmousedown=function(e){AM_.down=e.target};
$('mAsk').onclick=function(e){if(e.target===this&&AM_.down===this)closeModal()};
document.addEventListener('keydown',function(e){
  if(!$('mAsk').classList.contains('on'))return;
  if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeModal();return}
  if(e.key!=='Tab')return;
  var f=[$('amClose'),$('amCancel'),$('amOk')].filter(function(b){return b.style.display!=='none'&&!b.disabled});
  var i=f.indexOf(document.activeElement);
  if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}
  else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus()}
});
function take(r){
  if(!r)return false;
  if(r.busy){var m='Hệ thống đang bận, vui lòng thử lại.';say(m,true);toast(m,true);return false}
  if(r.error){say(r.error,true);toast(r.error,true);return false}
  var st=r.state||(r.books?r:null);
  if(st){S=st;STATE_SEQ_++;$('ver').textContent='v'+S.v+' · '+S.u;checkErrorTransitions_();draw();anaResume_()}
  return true;
}
var STATE_SEQ_=0;

var PREV_ST_={},ERR_SHOWN_={};
function checkErrorTransitions_(){
  if(!S)return;
  S.books.forEach(function(b){
    var prev=PREV_ST_[b.id];
    if(b.status==='ERROR'){
      if(prev&&prev!=='ERROR'&&!ERR_SHOWN_[b.id]&&typeof openErrorChapters==='function'){ERR_SHOWN_[b.id]=true;openErrorChapters(b.id)}
    }else ERR_SHOWN_[b.id]=false;
    if(b.site==='FILE'&&b.status==='COMPLETED'&&prev&&prev!=='COMPLETED')
      toast('Đã thêm xong truyện "'+b.name+'" ('+b.total+' '+(b.label==='Hồi'?'hồi':'chương')+').');
    PREV_ST_[b.id]=b.status;
  });
}

var VW={dl:'vDl',mg:'vMg',rd:'vRd'};
function show(v){
  cur=v;
  Object.keys(VW).forEach(function(k){$(VW[k]).classList.toggle('on',k===v)});
  document.querySelectorAll('.mi').forEach(function(m){m.classList.toggle('on',m.dataset.v===v)});
  if(v==='rd'&&typeof rdEnter==='function')rdEnter();
  if(v==='mg'&&S&&typeof drawMgr==='function')drawMgr();
  else if(v==='mg'&&!S&&typeof mgSkeleton_==='function')mgSkeleton_();
  window.scrollTo(0,0);
  if(typeof rdScrollFloat==='function')rdScrollFloat();
}
document.querySelectorAll('.mi').forEach(function(m){m.onclick=function(){show(m.dataset.v)}});
function sideSet_(col){
  var sd=$('appSide'),b=$('sTog');
  sd.classList.toggle('col',col);
  b.textContent=col?'»':'«';b.setAttribute('aria-expanded',col?'false':'true');
  b.title=b.ariaLabel=col?'Mở rộng thanh điều hướng':'Thu gọn thanh điều hướng';b.setAttribute('aria-label',b.title);
}
$('sTog').onclick=function(){
  var col=!$('appSide').classList.contains('col');sideSet_(col);
  try{localStorage.setItem('tttSideCol',col?'1':'0')}catch(e){}
};
try{if(localStorage.getItem('tttSideCol')==='1')sideSet_(true)}catch(e){}

document.querySelectorAll('#segMode button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#segMode button').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b?'true':'false')});
    var man=b.dataset.m==='man';
    $('modeAuto').style.display=man?'none':'';$('modeMan').style.display=man?'':'none';
    say('');$('info').style.display='none';INFO=null;
  };
});

function gname(g){return String(g||'').split(/[,;\/]/)[0].trim()||'Chưa phân loại'}
function dirPath(){return '/'+INFO.root+'/'+gname(INFO.genre)+'/'+INFO.name}

function addUrlRow_(v){
  var d=document.createElement('div');d.className='row urlx-row';
  var ix=document.createElement('input');ix.className='urlx';ix.placeholder='URL truyện';ix.setAttribute('aria-label','URL truyện');ix.title='Địa chỉ khác chờ phân tích';
  var bx=document.createElement('button');bx.type='button';bx.className='x';bx.dataset.rm='1';bx.title='Bỏ dòng này';bx.textContent='✕';
  d.appendChild(ix);d.appendChild(bx);
  d.querySelector('.urlx').value=v||'';
  d.querySelector('[data-rm]').onclick=function(){d.remove()};
  $('urlExtra').appendChild(d);
  return d;
}
$('bAddUrl').onclick=function(){addUrlRow_().querySelector('.urlx').focus()};
function clearUrlRows_(){$('urlExtra').textContent=''}
function collectUrls_(){
  var out=[];
  [$('url')].concat(Array.prototype.slice.call(document.querySelectorAll('.urlx'))).forEach(function(inp){
    String(inp.value||'').split(';').forEach(function(s){s=s.trim();if(s)out.push(s)});
  });
  return out;
}

var ANA_RUN_=false,ANA_CUR_='',ANA_TRIED_={},DRAW_ANA_KEY_='',ANA_ADDING_=[];
function elNew_(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
function clipLink_(url,label){
  var a=elNew_('a','clip','📎');
  a.title=label;a.setAttribute('aria-label',label);a.dataset.chucNang='dinh-kem';
  if(/^https?:\/\//i.test(String(url||''))){a.href=url;a.target='_blank';a.rel='noopener'}
  return a;
}
function iconBtn_(text,label,attr,id,cls){
  var b=elNew_('button',cls||'',text);
  b.type='button';b.title=label;b.setAttribute('aria-label',label);b.dataset[attr]='1';b.dataset.id=id;
  return b;
}
function anaTable_(title,heads,rows,tool){
  var box=elNew_('div'),hd=elNew_('div','hdrow'),wrap=elNew_('div','wrap'),t=elNew_('table','tbl'),th=elNew_('thead'),tr=elNew_('tr'),tb=elNew_('tbody');
  hd.appendChild(elNew_('h2','',title));
  if(tool)hd.appendChild(tool);
  heads.forEach(function(h){
    var th=elNew_('th',h[1]);
    if(h[2]){var gb=elNew_('button','thbtn',h[0]+' ▾');gb.type='button';gb.dataset[h[2]]='1';gb.title=h[3];gb.setAttribute('aria-label',h[3]);th.appendChild(gb)}
    else th.textContent=h[0];
    tr.appendChild(th);
  });
  th.appendChild(tr);t.appendChild(th);
  rows.forEach(function(r){tb.appendChild(r)});
  t.appendChild(tb);wrap.appendChild(t);box.appendChild(hd);box.appendChild(wrap);
  return box;
}
function anaHeldRows_(){
  var h=(S&&S.hang&&S.hang.h)||[],byId={};
  S.books.forEach(function(b){byId[b.id]=b});
  return h.map(function(x){var b=byId[x.id];return b?{id:b.id,name:b.name,author:b.author||'',genre:b.genre||'',total:b.total,url:x.url||b.url,folderId:b.folderId||''}:null}).filter(Boolean);
}
function anaDirPath_(b){return '/'+((S&&S.cfg&&S.cfg.ROOT_FOLDER)||'')+'/'+gname(b.genre)+'/'+b.name}
function anaRows_(){
  var hang=(S&&S.hang)||{},rows=[];
  anaHeldRows_().forEach(function(b){rows.push({k:'ok',id:b.id,name:b.name,author:b.author,genre:b.genre,url:b.url,total:b.total,folderId:b.folderId,dir:anaDirPath_(b)})});
  (hang.w||[]).forEach(function(u){rows.push({k:u===ANA_CUR_?'run':'wait',url:u})});
  (hang.e||[]).forEach(function(x){rows.push({k:'err',url:x.u,msg:x.m})});
  var seen={};
  rows.forEach(function(r){seen[r.url]=1});
  ANA_ADDING_.forEach(function(u){if(!seen[u]){seen[u]=1;rows.push({k:'add',url:u})}});
  return rows;
}
function anaUrlBtn_(text,label,attr,url,cls){
  var b=elNew_('button',cls||'',text);
  b.type='button';b.title=label;b.setAttribute('aria-label',label);b.dataset[attr]='1';b.dataset.url=url;
  return b;
}
function anaRow_(r,i){
  var tr=elNew_('tr'),ok=r.k==='ok',st=elNew_('td'),dir=elNew_('td'),ta=elNew_('td','act'),tl=elNew_('td'),chip;
  tr.appendChild(elNew_('td','n',String(i+1)));
  tr.appendChild(elNew_('td','',ok?r.name:''));
  tr.appendChild(elNew_('td','',ok?(r.author||'—'):''));
  tr.appendChild(elNew_('td','',ok?(r.genre||'—'):''));
  tl.appendChild(clipLink_(r.url,'Mở link truyện'));tr.appendChild(tl);
  if(ok){
    var sp=elNew_('span','anaDir',r.dir);sp.title=r.dir;dir.appendChild(sp);
    if(r.folderId){dir.appendChild(document.createTextNode(' '));dir.appendChild(clipLink_('https://drive.google.com/drive/folders/'+r.folderId,'Mở thư mục truyện trên Drive'))}
  }
  tr.appendChild(dir);
  if(ok){st.appendChild(elNew_('span','chst ok','Đã phân tích'));st.appendChild(elNew_('span','muted',r.total+' chương'))}
  else if(r.k==='run'){chip=elNew_('span','chst run','Đang phân tích');chip.appendChild(document.createElement('i'));st.appendChild(chip)}
  else if(r.k==='wait'||r.k==='add')st.appendChild(elNew_('span','muted','Chờ phân tích'));
  else{st.appendChild(elNew_('span','chst bad','Lỗi'));if(r.msg)st.appendChild(elNew_('div','err anaMsg',r.msg))}
  tr.appendChild(st);
  if(ok){
    ta.appendChild(iconBtn_('✏️','Sửa thông tin truyện','anaEdit',r.id));ta.appendChild(document.createTextNode(' '));
    ta.appendChild(iconBtn_('⬇️','Chuyển xuống tải','anaMove',r.id));ta.appendChild(document.createTextNode(' '));
    ta.appendChild(iconBtn_('🗑','Xóa truyện đã phân tích','anaDel',r.id,'x'));
  }else if(r.k==='wait'){
    ta.appendChild(anaUrlBtn_('🗑','Bỏ URL khỏi bảng phân tích','anaDrop',r.url,'x'));
  }else if(r.k==='err'){
    ta.appendChild(anaUrlBtn_('🔁','Phân tích lại URL này','anaRetry',r.url));ta.appendChild(document.createTextNode(' '));
    ta.appendChild(anaUrlBtn_('🗑','Bỏ URL khỏi bảng phân tích','anaDrop',r.url,'x'));
  }
  tr.appendChild(ta);
  return tr;
}
function drawAna_(){
  drawMon_();
  var box=$('anaBox'),rows=anaRows_(),held=rows.filter(function(r){return r.k==='ok'}),root=(S&&S.cfg&&S.cfg.ROOT_FOLDER)||'',key=JSON.stringify([rows,root]);
  if(key===DRAW_ANA_KEY_)return;
  DRAW_ANA_KEY_=key;box.textContent='';
  if(!rows.length)return;
  var all=null;
  if(held.length){
    all=elNew_('button','p','⬇️ Chuyển tất cả xuống tải');
    all.type='button';all.dataset.anaAll='1';all.title='Chuyển mọi truyện đã phân tích xuống luồng tải';all.setAttribute('aria-label','Chuyển tất cả xuống tải');
  }
  var genreHead=held.length?['Thể loại','','anaGenre','Chọn thể loại áp dụng cho tất cả truyện đã phân tích']:['Thể loại',''];
  box.appendChild(anaTable_('Bảng phân tích truyện ('+rows.length+')',[['STT','n'],['Tên truyện',''],['Tác giả',''],genreHead,['Url',''],['Thư mục',''],['Trạng thái',''],['Thao tác','act']],rows.map(anaRow_),all));
}
function anaPickGenre_(){
  var held=anaHeldRows_();if(!held.length)return;
  var first=held[0].genre,same=held.every(function(b){return b.genre===first});
  $('anaGenre').value=same?first:'';
  openGenrePick_($('anaGenre'),{requireOne:true,note:'Áp dụng cho '+held.length+' truyện đã phân tích. Thể loại đầu tiên (thể loại chính) quyết định thư mục Drive của truyện.',onOk:anaApplyGenre_});
}
async function anaApplyGenre_(genre){
  var ids=anaHeldRows_().map(function(b){return b.id});if(!ids.length)return;
  var r=await call('api_setGenreMany',ids,genre);
  if(!take(r))return;
  var bad=Object.keys(r.errors||{}),m='Đã áp dụng thể loại "'+genre+'" cho '+r.ok+' truyện'+(bad.length?'; '+bad.length+' truyện lỗi: '+bad.map(function(id){var b=S.books.filter(function(x){return x.id===id})[0];return (b?b.name:id)+' — '+r.errors[id]}).join('; '):'')+'.';
  say(m,!!bad.length);toast(m,!!bad.length);
}
$('anaBox').onclick=async function(e){
  var gn=e.target.closest('button[data-ana-genre]');
  if(gn){anaPickGenre_();return}
  var dr=e.target.closest('button[data-ana-drop]'),rt=e.target.closest('button[data-ana-retry]');
  if(dr||rt){
    var bt=dr||rt,u=bt.dataset.url;
    if(bt.disabled)return;
    if(dr){
      if(u===ANA_CUR_){toast('URL đang được phân tích, không thể bỏ lúc này.',true);return}
      if(!(await askConfirm('Bỏ URL này khỏi bảng phân tích?\n'+u,{title:'Bỏ khỏi bảng phân tích',okText:'Bỏ',danger:true})))return;
      if(u===ANA_CUR_){toast('URL đang được phân tích, không thể bỏ lúc này.',true);return}
      bt.disabled=true;
      if(take(await call('api_dropPending',u)))toast('Đã bỏ URL khỏi bảng phân tích.');else bt.disabled=false;
      return;
    }
    bt.disabled=true;
    if(take(await call('api_retryAnalyze',u))){delete ANA_TRIED_[u];toast('Đã đưa URL vào lại danh sách chờ phân tích.');anaResume_()}
    else bt.disabled=false;
    return;
  }
  var all=e.target.closest('button[data-ana-all]'),mv=e.target.closest('button[data-ana-move]'),ed=e.target.closest('button[data-ana-edit]'),dl=e.target.closest('button[data-ana-del]');
  if(ed){if(typeof openEdit==='function')openEdit(ed.dataset.id);return}
  if(dl){if(typeof openDel==='function')openDel(dl.dataset.id);return}
  var btn=all||mv;if(!btn||btn.disabled)return;
  var ids=all?anaHeldRows_().map(function(b){return b.id}):[btn.dataset.id];
  if(!ids.length)return;
  btn.disabled=true;
  var r=await call('api_moveToDownload',ids);
  if(take(r)){
    var m='Đã chuyển '+r.moved+' truyện xuống tải'+(r.started?': '+r.started+' vào luồng tải':'')+(r.queued?(r.started?', ':': ')+r.queued+' vào hàng chờ tải':'')+'.';
    say(m);toast(m);
  }
  btn.disabled=false;
};
function anaResume_(){
  if(ANA_RUN_||gone||!S||!S.hang)return;
  var next=(S.hang.w||[]).filter(function(u){return !ANA_TRIED_[u]});
  if(next.length)anaRun_();
}
async function anaRun_(){
  if(ANA_RUN_)return;
  ANA_RUN_=true;$('info').style.display='none';INFO=null;
  var added=[],updated=[],same=[],failed=[],warns=[],done=0;
  try{
    for(;;){
      var left=((S&&S.hang&&S.hang.w)||[]).filter(function(x){return !ANA_TRIED_[x]});
      if(!left.length)break;
      var u=left[0];
      ANA_TRIED_[u]=1;ANA_CUR_=u;drawAna_();
      say('Đang phân tích truyện '+(done+1)+'/'+(done+left.length)+' ('+hostOf(u)+')…');
      var timer=anaStepsAnimate_(),r=await call('api_analyzeAndHold',u);
      clearInterval(timer);anaStepsRender_(ANA_STEPS_.length);
      await sleep_(250);anaStepsHide_();
      ANA_CUR_='';done++;

  }

  if(updated.length)parts.push('cập nhật '+updated.length+' truyện có chương mới: '+updated.join(', '));

function chTreeNode_(items,isOpen){

      curV.kids.push({it:it});

  });

var Q1_={};
function drawQueue(){
  var queue=S.books.filter(function(b){return b.status==='IDLE'});
  if(!queue.length){if(DRAW_QUEUE_KEY_){DRAW_QUEUE_KEY_='';$('queueBox').textContent=''}return}
  var key=queue.map(function(b){return b.id+':'+b.name+':'+b.total}).join('|');
  if(key!==DRAW_QUEUE_KEY_){DRAW_QUEUE_KEY_=key;renderQueue_(queue)}
  var missing=queue.map(function(b){return b.id}).filter(function(id){return !(id in Q1_)});
  if(missing.length)call('api_firstChapterUrls',missing).then(function(r){
    if(r&&!r.error)Object.keys(r).forEach(function(id){Q1_[id]=r[id]});
    var q2=S.books.filter(function(b){return b.status==='IDLE'});
    if(q2.length)renderQueue_(q2);
  });
}

    var u=Q1_[b.id];

    +'<td>'+(u?'<a href="'+thoatHtml(u)+'" target="_blank" rel="noopener">Mở link</a>':'<span class="muted">—</span>')+'</td>'

    +'<button data-q="up" data-id="'+thoatHtml(b.id)+'"'+(i===0?' disabled':'')+' title="Lên">▲</button> '
    +'<button data-q="down" data-id="'+thoatHtml(b.id)+'"'+(i===queue.length-1?' disabled':'')+' title="Xuống">▼</button> '

    +'<button class="x" data-qdel="1" data-id="'+thoatHtml(b.id)+'" title="Xóa hẳn truyện này">🗑</button></td></tr>';

var TM_={f:'all',struct:''};
var TM_GRP_={DOWNLOADING:'run',READY:'run',IDLE:'wait',PAUSED:'pause',ERROR:'err'};
var TM_FILTERS_=[['all','Tất cả'],['run','Đang chạy'],['wait','Chờ'],['pause','Tạm dừng'],['err','Lỗi']];
var TM_ICON_={run:'⏳',wait:'🕒',pause:'⏸',err:'⚠️'};
var TM_BTN_={
  pause:['⏸','Tạm dừng',''],start:['▶️','Tải tiếp / tải ngay',''],retry:['🔁','Tải lại chương lỗi',''],
  del:['🗑','Xóa truyện','x'],drop:['🗑','Bỏ khỏi hàng chờ phân tích','x']
};
function tmItems_(){
  var out=[],w=(S&&S.hang&&S.hang.w)||[];
  w.forEach(function(u){
    var on=u===ANA_CUR_;
    out.push({k:'a:'+u,grp:on?'run':'wait',title:hostOf(u)||u,sub:u,label:on?'Đang phân tích':'Chờ phân tích',pct:null,acts:on?[]:['drop'],url:u});
  });
  (S?S.books:[]).forEach(function(b){
    var g=TM_GRP_[b.status];if(!g)return;
    var pct=b.total?Math.round(b.done*100/b.total):0,prog=b.done+'/'+b.total+' '+(b.label||'chương').toLowerCase();
    var label,acts;
    if(b.status==='DOWNLOADING'){label='Đang tải ('+prog+')';acts=['pause','del']}
    else if(b.status==='READY'){label='Đang chuẩn bị ('+prog+')';acts=['pause','del']}
    else if(b.status==='IDLE'){label='Chờ tải ('+prog+')';acts=['start','pause','del']}
    else if(b.status==='PAUSED'){label='Tạm dừng ('+prog+')';acts=['start','del']}
    else{label=(b.err?b.err+' chương lỗi':'Có lỗi')+' ('+prog+')';acts=['retry','del']}
    out.push({k:'b:'+b.id,grp:g,title:b.name,sub:'',label:label,pct:b.total?pct:null,acts:acts,id:b.id});
  });
  return out;
}
function tmBtn_(a,it){
  var d=TM_BTN_[a],t=a==='pause'&&it.grp==='wait'?'Bỏ khỏi hàng chờ tải':d[1];
  return '<button type="button" class="tm-btn'+(d[2]?' '+d[2]:'')+'" data-tm="'+a+'"'+(it.id?' data-id="'+thoatHtml(it.id)+'"':'')+(it.url?' data-url="'+thoatHtml(it.url)+'"':'')+' title="'+thoatHtml(t)+'" aria-label="'+thoatHtml(t+': '+it.title)+'">'+d[0]+'</button>';
}
function drawMon_(){
  if(!S||!$('taskMon'))return;
  var all=tmItems_(),box=$('taskMon'),done=S.books.filter(function(b){return b.status==='COMPLETED'}).length;
  box.style.display=all.length?'':'none';
  if(!all.length){TM_.struct='';return}
  var cnt={all:all.length};
  all.forEach(function(it){cnt[it.grp]=(cnt[it.grp]||0)+1});
  if(!cnt[TM_.f]&&TM_.f!=='all')TM_.f='all';
  $('tmCount').textContent='('+all.length+(done?' · '+done+' đã hoàn thành':'')+')';
  var fk=TM_FILTERS_.map(function(f){return f[0]+(cnt[f[0]]||0)}).join('|')+TM_.f;
  if($('tmFilter').dataset.k!==fk){
    $('tmFilter').dataset.k=fk;
    $('tmFilter').innerHTML=TM_FILTERS_.filter(function(f){return f[0]==='all'||cnt[f[0]]}).map(function(f){
      return '<button type="button" data-f="'+f[0]+'" class="'+(TM_.f===f[0]?'on':'')+'" aria-pressed="'+(TM_.f===f[0])+'">'+f[1]+' '+(cnt[f[0]]||0)+'</button>';
    }).join('');
  }
  var list=all.filter(function(it){return TM_.f==='all'||it.grp===TM_.f});
  var sk=TM_.f+'#'+list.map(function(it){return it.k+'|'+it.grp+'|'+it.title+'|'+it.acts.join(',')+'|'+(it.pct===null?'n':'p')}).join('~'),host=$('tmList');
  if(sk===TM_.struct){
    list.forEach(function(it){
      var row=host.querySelector('[data-k="'+(window.CSS&&CSS.escape?CSS.escape(it.k):it.k)+'"]');if(!row)return;
      var st=row.querySelector('.tm-st'),bar=row.querySelector('.bar i');
      if(st&&st.textContent!==it.label)st.textContent=it.label;
      if(bar&&bar.style.width!==it.pct+'%')bar.style.width=it.pct+'%';
    });
    return;
  }
  TM_.struct=sk;
  var focusKey=document.activeElement&&host.contains(document.activeElement)?document.activeElement.closest('[data-k]').dataset.k+'|'+document.activeElement.dataset.tm:'';
  host.innerHTML=list.length?list.map(function(it){
    return '<div class="tm-item g-'+it.grp+'" data-k="'+thoatHtml(it.k)+'"><div class="tm-info"><span class="tm-title" title="'+thoatHtml(it.sub||it.title)+'">'+thoatHtml(it.title)+'</span>'
      +'<span class="tm-stl"><span class="tm-ic" aria-hidden="true">'+TM_ICON_[it.grp]+'</span><span class="tm-st">'+thoatHtml(it.label)+'</span></span>'
      +(it.pct!==null?'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+it.pct+'"><i style="width:'+it.pct+'%"></i></div>':'')+'</div>'
      +'<div class="tm-acts">'+it.acts.map(function(a){return tmBtn_(a,it)}).join('')+'</div></div>';
  }).join(''):'<p class="muted" style="margin:6px 2px">Không có tác vụ nào ở mục này.</p>';
  if(focusKey){var p=focusKey.split('|'),rows=host.querySelectorAll('[data-k]'),f;[].forEach.call(rows,function(r){if(r.dataset.k===p[0])f=r.querySelector('button[data-tm="'+p[1]+'"]')});if(f)f.focus()}
}

var GN={edit:false,list:[]};
function gmsg(t,bad){$('gMsg').textContent=t||'';$('gMsg').className=bad?'err':'muted'}
function gnKey_(s){return normVi_(s).replace(/\s+/g,' ')}
function gnSort_(a){return a.sort(function(x,y){return x.localeCompare(y,'vi',{sensitivity:'base'})})}
function gnClean_(s){return String(s||'').replace(/[,;\/\\:*?"<>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,120)}
function gnAddNames_(names){
  var have={},added=0,dup=0;
  GN.list.forEach(function(g){have[gnKey_(g)]=1});
  names.forEach(function(n){
    n=gnClean_(n);if(!n)return;
    var k=gnKey_(n);if(have[k]){dup++;return}
    have[k]=1;GN.list.push(n);added++;
  });
  gnSort_(GN.list);
  return {added:added,dup:dup};
}

  var box=$('gGrid'),list=GN.edit?GN.list:((S&&S.cfg&&S.cfg.GENRES)||[]);

    var c=document.createElement('div');c.className='cell';
    var v=document.createElement('div');v.className='v';v.textContent=g;c.appendChild(v);
    if(GN.edit){var b=document.createElement('button');b.type='button';b.className='ico';b.dataset.i=String(i);b.title='Bỏ thể loại này';b.setAttribute('aria-label','Bỏ thể loại '+g);b.textContent='✕';c.appendChild(b)}
    box.appendChild(c);
  });
  if(!list.length){var p=document.createElement('p');p.className='muted';p.style.gridColumn='1/-1';p.textContent='Chưa có thể loại nào. Bấm ✏️ để thêm, hoặc \"Nhập từ truyện hiện có\".';box.appendChild(p)}

$('gEdit').onclick=async function(){
  if(!GN.edit){GN.edit=true;GN.list=((S.cfg.GENRES)||[]).slice();gmsg('');drawGenres_();$('gNew').focus();return}
  this.disabled=true;gmsg('Đang lưu…');
  var r=await call('api_saveGenres',GN.list);
  this.disabled=false;
  if(take(r)){GN.edit=false;drawGenres_();gmsg('Đã lưu '+((S.cfg.GENRES||[]).length)+' thể loại.');toast('Đã lưu danh sách thể loại.')}
  else gmsg(r&&r.error||'Không lưu được.',true);
};

function openHelp_(key){
  var h=HELP_[key];if(!h)return;
  var ol=document.createElement(h.u?'ul':'ol'),box=$('hlpB');
  $('hlpT').textContent=h.t;
  h.s.forEach(function(x){var li=document.createElement('li');li.textContent=x;ol.appendChild(li)});
  box.textContent='';box.appendChild(ol);$('mHelp').classList.add('on');
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-help]');if(b)openHelp_(b.dataset.help)});

$('bExit').onclick=async function(){if(await askConfirm('Thoát giao diện? Truyện đang tải vẫn chạy nền nếu bật tự động tiếp tục.',{title:'Thoát giao diện',okText:'Thoát'})){gone=true;$('bye').style.display='flex'}};
$('bBack').onclick=function(){gone=false;$('bye').style.display='none';loop()};

async function loop(){
  if(gone)return;
  if(!busy){busy=true;
    var dl=S&&S.books.some(function(b){return b.status==='DOWNLOADING'||b.status==='READY'||b.status==='IDLE'});
    var seq=STATE_SEQ_,r=await call(S===null||!dl?'api_getState':'api_tick');
    if(seq!==STATE_SEQ_){}
    else if(r&&r.busy){take(r)}else if(r&&r.error){say(r.error,true)}else take(r);
    busy=false}
  setTimeout(loop,S&&S.books.some(function(b){return b.status==='DOWNLOADING'||b.status==='READY'||b.status==='IDLE'})?1200:5000);
}
loop();
