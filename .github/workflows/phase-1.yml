name: Web foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: local-only-password
          POSTGRES_DB: bookdownloader
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bookdownloader"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://postgres:local-only-password@127.0.0.1:55432/bookdownloader
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Golden runner verifies pinned legacy commit.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.9.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:db
      - run: npm run test:auth:db
      - run: npm run test:storage:db
      - run: npm run test:reader:db
      - run: npm run test:management:db
      - run: npm run test:operations:db
        env:
          BOOK_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:migration:load
      - run: npm run test:download:db
      - run: npm run test:auth:concurrency
      - run: npm run db:migrate # Check repeatability.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:auth:browser
      - run: npm run test:reader:browser
      - run: npm run test:management:browser
      - run: npm run test:download:browser
      - run: npm run test:operations:browser
      - run: npm run build:web && npm run test:bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: server-secret-sentinel
          DRIVE_CLIENT_SECRET: drive-secret-sentinel
          DRIVE_REFRESH_TOKEN: drive-secret-sentinel
          SOURCE_COOKIES_JSON: source-cookie-sentinel
      - run: docker build --build-arg RELEASE_REVISION="$GITHUB_SHA" -f apps/worker/Dockerfile -t book-worker:ci .
      - run: docker run --rm book-worker:ci node dist/worker.mjs --version
      - run: docker run --rm --network host -e APP_ENV -e DATABASE_URL book-worker:ci node dist/worker.mjs --check
      - run: npm run release:prepare -- .local-library/release-candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Stage verified candidate paths
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .local-library/release-candidate/apps/web
          cp -R apps/web/dist .local-library/release-candidate/apps/web/dist
          cp -R dist .local-library/release-candidate/dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-candidate
          retention-days: 14
          path: .local-library/release-candidate/
          include-hidden-files: true
# Production deploy is manual via release.yml. Disable automatic production publishing in Netlify Git integration.
# No migration or deploy runs with production credentials from a PR.
