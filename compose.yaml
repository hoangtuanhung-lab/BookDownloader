services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: bookdownloader
      POSTGRES_PASSWORD: local-only-password
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["bookdownloader-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookdownloader"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  bookdownloader-db:
